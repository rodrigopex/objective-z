[package]
name = "oz_static"
version = "0.30.0"
edition = "2021"
description = "OZ-091 Track B spike: static-subset Objective-C to C transpiler using in-place textual substitution"
publish = false

[lib]
name = "oz_static"
path = "src/lib.rs"

[[bin]]
name = "oz2c"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.24"
tree-sitter-objc = "3.0.2"
# Reads the Clang AST JSON that carries the ARC ownership facts oz_static
# cannot see for itself (see src/astinfo.rs). A host build-tool dependency
# only -- nothing here reaches the embedded target.
serde_json = "1"
