# SPDX-License-Identifier: Apache-2.0
name: Transpiler CI

on:
  push:
    branches: [main, feature/transpiler]
  pull_request:
    branches: [main]

# Two clangs, both 19, differing by target -- and that is the point.
#
# Every job that needs clang needs it for the same reason: the Python
# pipeline and oz_static's `--ast` both read a Clang JSON AST, and that
# AST decides ivar ownership and method definedness in the generated C.
# Until #269 this workflow had three answers at once -- `apt install
# clang-20` in eight places, `objz_find_clang()` silently falling through
# to Ubuntu's preinstalled clang 18.1 because the SDK was installed
# without its LLVM component, and the Python harness's own version search
# picking whichever `clang-NN` it found first. The tested version is 19
# (`cmake/ObjcClang.cmake`).
#
# The first attempt at fixing that used the SDK's clang everywhere, on
# the reasoning that one clang beats three. Wrong, and CI said so in two
# minutes: the SDK's clang is a *cross* toolchain, so on a host compile
# it reaches `/usr/include/stdint.h` and cannot find
# `bits/libc-header-start.h`, which Debian multiarch puts in
# `/usr/include/x86_64-linux-gnu/`. 276 of 539 Python tests failed.
#
# So the split is by target, not by version:
#
#   install-host-clang.sh   clang 19 for x86_64 Linux -- the jobs whose
#                           ASTs describe code compiled and run here
#   install-zephyr-sdk.sh   the SDK's cross clang 19 -- the jobs that
#                           build for a board, where cmake finds it via
#                           ZEPHYR_SDK_INSTALL_DIR and hands it a triple
env:
  ZEPHYR_SDK_VERSION: "1.0.1"
  ZEPHYR_SDK_INSTALL_DIR: /home/runner/zephyr-sdk-1.0.1
  # The host jobs' clang. The Zephyr jobs override nothing -- cmake finds
  # the SDK's cross clang through ZEPHYR_SDK_INSTALL_DIR, and passes it a
  # target triple, which is the whole reason there are two.
  OZ_CLANG: /usr/bin/clang-19

jobs:
  # The primary gate for the static backend, and until #269 it never ran
  # here at all: this workflow built oz2c only indirectly, through
  # oz_static.cmake, and never invoked `cargo test`. So all 262 tests --
  # the corpus's `-std=c17 -pedantic-errors` compile check among them
  # (#266) -- held on a maintainer's machine and were unverified on every
  # PR.
  #
  # It needs no Zephyr, no west and no SDK: the suite shells out to `cc`
  # and nothing else, and `ast_facts.rs` deliberately uses a checked-in
  # dump excerpt rather than running clang. So this is the cheapest job
  # in the file despite guarding the most.
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/oz_static/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/oz_static/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version
          cc --version | head -1

      # Warnings are part of the gate, not decoration -- the maintainer
      # workflow requires the suite clean including them.
      - name: Build (warnings are errors)
        run: RUSTFLAGS="-D warnings" cargo build --manifest-path tools/oz_static/Cargo.toml --all-targets

      - name: Run the Rust test suite
        run: cargo test --manifest-path tools/oz_static/Cargo.toml

  # Python tests (transpiler unit + golden tests)
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install host clang 19
        run: .github/install-host-clang.sh

      - name: Install dependencies
        run: pip install pytest pytest-cov jinja2 tree-sitter tree-sitter-objc

      - name: Run transpiler tests with coverage
        run: >
          PYTHONPATH=tools
          python3 -m pytest tools/oz_transpile/tests/ -v
          --cov=oz_transpile --cov-report=xml

      - name: Upload Python coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  # Behavior tests — compiler × optimization matrix
  behavior-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        opt: [O0, O2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install host clang 19
        run: .github/install-host-clang.sh

      - name: Install Python dependencies
        run: pip install pytest jinja2 tree-sitter tree-sitter-objc

      # `--compiler=clang` is the C compiler for the generated code, a
      # separate role from the AST clang. The symlink install-host-clang.sh
      # writes makes both of them 19; before it, this leg compiled with
      # Ubuntu's preinstalled 18.1 while dumping ASTs with 20 -- two
      # clangs in one job, neither of them chosen.
      - name: Run behavior tests
        run: >
          PYTHONPATH=tools
          python3 -m pytest tests/behavior/ -v
          --backend=static
          --compiler=${{ matrix.compiler }}
          --opt=${{ matrix.opt }}

  # Sanitizer run (ASan + UBSan)
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install host clang 19
        run: .github/install-host-clang.sh

      - name: Install Python dependencies
        run: pip install pytest jinja2 tree-sitter tree-sitter-objc

      - name: Run with AddressSanitizer + UBSan
        run: >
          PYTHONPATH=tools
          python3 -m pytest tests/behavior/ -v
          --backend=static
          --compiler=gcc
          --opt=O0
          --sanitize=address,undefined

  # C coverage (gcov)
  c-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr

      - name: Install host clang 19
        run: .github/install-host-clang.sh

      - name: Install Python dependencies
        run: pip install pytest jinja2 tree-sitter tree-sitter-objc

      - name: Run behavior tests with coverage
        run: >
          PYTHONPATH=tools
          python3 -m pytest tests/behavior/ -v
          --backend=static
          --compiler=gcc
          --opt=O0
          --cflags=--coverage
          --ldflags=--coverage

      - name: Generate C coverage report
        run: gcovr --xml -o c_coverage.xml --filter='.*\.c'

      - name: Upload C coverage
        uses: codecov/codecov-action@v4
        with:
          files: c_coverage.xml
          flags: c-transpiled
          fail_ci_if_error: false

  # Adapted upstream tests
  adapted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install host clang 19
        run: .github/install-host-clang.sh

      - name: Install Python dependencies
        run: pip install pytest jinja2 tree-sitter tree-sitter-objc

      - name: Run adapted upstream tests
        run: PYTHONPATH=tools python3 -m pytest tests/adapted/ -v --backend=static

  # PAL (Platform Abstraction Layer) tests
  pal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pytest

      - name: Run PAL tests
        run: python3 -m pytest tests/pal/ -v

  # LeakSanitizer (standalone LSan)
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install host clang 19
        run: .github/install-host-clang.sh

      - name: Install Python dependencies
        run: pip install pytest jinja2 tree-sitter tree-sitter-objc

      - name: Run behavior tests with LeakSanitizer
        run: >
          PYTHONPATH=tools
          python3 -m pytest tests/behavior/ -v
          --backend=static
          --compiler=gcc
          --opt=O0
          --check-leaks

  # Hardware build verification (compile-only for ARM + RISC-V)
  #
  # No `continue-on-error` here any more (#269). It was the only job in
  # this file with it, and it was the only job that cross-compiles for a
  # board -- so the check most worth believing was the one that could not
  # fail, and it reported `pass` whatever the build did. Verified safe to
  # remove: the last ten runs had every step succeed on both boards.
  hw-build-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [mps2/an385, qemu_riscv32]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gperf device-tree-compiler gcc-multilib g++-multilib

      - name: Install west
        run: pip install west

      - name: Cache Zephyr SDK
        uses: actions/cache@v4
        with:
          path: /home/runner/zephyr-sdk-1.0.1
          key: zephyr-sdk-1.0.1-arm-riscv-llvm

      - name: Install Zephyr SDK (with LLVM)
        run: .github/install-zephyr-sdk.sh

      - name: Initialize workspace
        run: |
          west init -l .
          west update --fetch-opt=--depth=1

      - name: Install Zephyr deps
        run: |
          pip install -r ../zephyr/scripts/requirements-base.txt natsort tabulate
          pip install jinja2 tree-sitter tree-sitter-objc

      # -DOBJZ_REQUIRE_TESTED_CLANG=ON turns objz_find_clang()'s
      # compatibility warning into a hard error. Without it this job spent
      # its whole life dumping ASTs with a clang nobody chose.
      - name: Build sample (compile only)
        run: >
          PYTHONPATH=tools west build -b ${{ matrix.board }} samples/hello_world
          -- -DOBJZ_REQUIRE_TESTED_CLANG=ON

      - name: Verify PAL inlining (ARM only)
        if: contains(matrix.board, 'mps2')
        run: |
          OBJDUMP=$(find $ZEPHYR_SDK_INSTALL_DIR -name "arm-zephyr-eabi-objdump" | head -1)
          PAL_CALLS=$($OBJDUMP -d build/zephyr/zephyr.elf | grep -c 'bl.*oz_slab_alloc\|bl.*oz_atomic\|bl.*oz_spin' || true)
          if [ "$PAL_CALLS" -ne 0 ]; then
            echo "FAIL: PAL functions not inlined ($PAL_CALLS call sites found)"
            $OBJDUMP -d build/zephyr/zephyr.elf | grep 'bl.*oz_'
            exit 1
          fi
          echo "PASS: All PAL functions inlined (zero call sites)"

  # ISO C validity of the generated C, on target (#266, gated since #267).
  #
  # `rust-tests` already gates the *corpus* at `-std=c17 -pedantic-errors`
  # on host. This asks the same of the samples with the real ARM
  # toolchain, which is a different question: the item-pool `;` gap Y
  # found was valid on host and a constraint violation on Zephyr, so no
  # host check could see it.
  #
  # It is a gate, not a report: `objz_pedantic_sweep.py` exits non-zero
  # unless what it finds matches `KNOWN_PEDANTIC` exactly -- a new
  # violation fails, and so does a baseline entry that stopped occurring,
  # which is `KNOWN_CC_FAILURES`'s discipline. It ran only on a
  # maintainer's machine until now, which is how three sites reached main
  # in #275 unmeasured; #269 is the standing lesson that a check CI does
  # not run is a check that holds nowhere.
  pedantic-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gperf device-tree-compiler gcc-multilib g++-multilib

      - name: Install west
        run: pip install west

      - name: Cache Zephyr SDK
        uses: actions/cache@v4
        with:
          path: /home/runner/zephyr-sdk-1.0.1
          key: zephyr-sdk-1.0.1-arm-riscv-llvm

      - name: Install Zephyr SDK (with LLVM)
        run: .github/install-zephyr-sdk.sh

      - name: Initialize workspace
        run: |
          west init -l .
          west update --fetch-opt=--depth=1

      - name: Install Zephyr deps
        run: |
          pip install -r ../zephyr/scripts/requirements-base.txt natsort tabulate
          pip install jinja2 tree-sitter tree-sitter-objc

      # OZ_CLANG so the AST dumps use the SDK's tested clang 19 rather than
      # whatever is on PATH -- the same substitution #269 found running
      # unnoticed for the life of this workflow.
      - name: Pedantic sweep (mps2/an385)
        run: >
          PYTHONPATH=tools
          OZ_CLANG=$ZEPHYR_SDK_INSTALL_DIR/llvm/bin/clang
          python3 scripts/objz_pedantic_sweep.py --board mps2/an385

  # Zephyr's own spinlock validation, against generated C (#278).
  #
  # CONFIG_SPIN_VALIDATE had never been enabled on any board, so every
  # green `@synchronized` result to date came from a configuration where
  # the kernel's lock-misuse assertions are compiled out. It is not
  # reachable by accident: it sits inside `if ASSERT` in Zephyr's
  # subsys/debug/Kconfig and no sample enables asserts, so
  # samples/overlay-spin-validate.conf turns both on.
  #
  # It builds *and runs*, unlike hw-build-check: an __ASSERT failure is a
  # runtime fatal error, so a compile-only job cannot see one at all. The
  # SDK's host tools (-h) ship qemu-system-arm, so twister can execute.
  #
  # ARM only. The two-core leg needs aarch64-zephyr-elf, which
  # install-zephyr-sdk.sh does not install, and stays `just
  # test-spin-validate` locally. What that costs is small but real, and
  # is the reason samples/pool_demo now nests `@synchronized` across a
  # method boundary: without it no ARM-eligible sample re-enters a lock,
  # and this job would pass with the oz_sync_owner guard removed. With
  # it, disabling that guard fails here too -- checked, not assumed.
  spin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gperf device-tree-compiler gcc-multilib g++-multilib

      - name: Install west
        run: pip install west

      - name: Cache Zephyr SDK
        uses: actions/cache@v4
        with:
          path: /home/runner/zephyr-sdk-1.0.1
          key: zephyr-sdk-1.0.1-arm-riscv-llvm

      - name: Install Zephyr SDK (with LLVM)
        run: .github/install-zephyr-sdk.sh

      - name: Initialize workspace
        run: |
          west init -l .
          west update --fetch-opt=--depth=1

      - name: Install Zephyr deps
        run: |
          pip install -r ../zephyr/scripts/requirements-base.txt \
                      -r ../zephyr/scripts/requirements-build-test.txt \
                      natsort tabulate
          pip install jinja2 tree-sitter tree-sitter-objc

      # OZ_CLANG so the AST dumps use the SDK's tested clang 19 rather
      # than whatever is on PATH -- the substitution #269 found running
      # unnoticed for the life of this workflow.
      - name: Samples under CONFIG_SPIN_VALIDATE (mps2/an385)
        run: >
          PYTHONPATH=tools
          OZ_CLANG=$ZEPHYR_SDK_INSTALL_DIR/llvm/bin/clang
          west twister -T samples/ -p mps2/an385 --inline-logs
          -x=EXTRA_CONF_FILE=$GITHUB_WORKSPACE/samples/overlay-spin-validate.conf

  # Zephyr integration tests (native_sim)
  #
  # Note what this does and does not prove: tests/zephyr/CMakeLists.txt
  # globs the *pre-generated* C committed under tests/zephyr/generated/,
  # so a green run says that committed C runs on Zephyr and nothing about
  # oz_static. `generated-freshness` below is what ties those files back
  # to the transpiler.
  zephyr-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gperf device-tree-compiler gcc-multilib g++-multilib

      - name: Install west
        run: pip install west

      - name: Cache Zephyr SDK
        uses: actions/cache@v4
        with:
          path: /home/runner/zephyr-sdk-1.0.1
          key: zephyr-sdk-1.0.1-arm-riscv-llvm

      - name: Install Zephyr SDK (with LLVM)
        run: .github/install-zephyr-sdk.sh

      - name: Initialize Zephyr workspace
        run: |
          west init -l .
          west update --narrow --fetch-opt=--depth=1

      - name: Install Zephyr Python deps
        run: |
          pip install -r ../zephyr/scripts/requirements-base.txt \
                      -r ../zephyr/scripts/requirements-build-test.txt \
                      natsort tabulate

      - name: Build and run tests on native_sim
        run: west twister -T tests/zephyr/ -p native_sim --inline-logs

  # Generated file freshness check
  generated-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install host clang 19
        run: .github/install-host-clang.sh

      - name: Install Python dependencies
        run: pip install jinja2 tree-sitter tree-sitter-objc

      - name: Regenerate Zephyr test sources
        run: PYTHONPATH=tools python scripts/regen_zephyr_tests.py

      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet tests/zephyr/generated/; then
            echo "FAIL: Transpiled test sources are stale. Run:"
            echo "  PYTHONPATH=tools python scripts/regen_zephyr_tests.py"
            echo "and commit the updated files."
            git diff tests/zephyr/generated/
            exit 1
          fi
