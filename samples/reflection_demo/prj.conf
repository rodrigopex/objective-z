CONFIG_PRINTK=y
CONFIG_OBJZ=y
# CONFIG_OBJZ_INTROSPECTION and CONFIG_OBJZ_REFLECTION both default to y, so
# they are deliberately not set here: this sample is the check that the
# defaults are what a plain `CONFIG_OBJZ=y` build gets. Setting either to n
