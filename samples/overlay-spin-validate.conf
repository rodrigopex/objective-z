# Zephyr's own spinlock validation, for `just test-spin-validate`.
#
# Not in any sample's prj.conf, deliberately: this asks the kernel to check
# generated code's lock discipline, which is a test configuration rather
# than something a sample needs to run. Applied to every sample at once
# through twister's `-x=EXTRA_CONF_FILE=...`.
#
# CONFIG_ASSERT is the point of the first line rather than a convenience:
# CONFIG_SPIN_VALIDATE lives inside `if ASSERT` in Zephyr's
# subsys/debug/Kconfig, and no sample enables asserts, which is why the
# validator had never run against generated C on any board (#278).
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

# Populates `struct k_spinlock` with `thread_cpu` and makes two assertions
# live in include/zephyr/spinlock.h:
#
#   :132  z_spin_lock_valid()   -- the current CPU already holds this lock,
#                                  i.e. a recursive acquire. This is the one
#                                  `@synchronized`'s oz_sync_owner check
#                                  exists to prevent.
#   :306  z_spin_unlock_valid() -- the unlocker is not the (cpu, thread)
#                                  pair that took the lock.
#
# A third only exists under this flag: z_spin_onexit (:379) asserts a
# K_SPINLOCK block was not left by return/break/goto, which really does
# leak the lock with interrupts masked. Synthesized atomic accessors use
# OZ_SPINLOCK == K_SPINLOCK, so they are checked by it.
CONFIG_SPIN_VALIDATE=y
